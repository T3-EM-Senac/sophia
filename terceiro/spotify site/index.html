<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spotify - Trabalho Final</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🎵 Spotify Edu</div>
    <button id="themeToggle" class="theme-btn" aria-label="Alternar tema">🌙</button>
  </header>

  <main>
    <section class="hero">
      <h1>Como o Spotify funciona</h1>
      <p>Integração entre Web, Mobile, APIs e Banco de Dados — demo para apresentação.</p>
      <a class="cta" href="#playlists">Ver playlists</a>
    </section>

    <section id="playlists" class="container">
      <h2>Playlists em destaque</h2>
      <div id="playlistGrid" class="playlist-grid" aria-live="polite"></div>
    </section>

    <section id="about" class="container">
      <h2>Sobre</h2>
      <p>Versão minimal e estável para apresentação — offline friendly.</p>
    </section>
  </main>

  <footer class="footer">Feito para apresentação • Boa sorte na formatura 🎓</footer>

  <script src="js/script.js"></script>
</body>
</html>
