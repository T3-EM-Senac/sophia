<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify — Player Moderno</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
<div class="logo">Spotify</div>
<nav class="menu">
<a href="#home">Home</a>
<a href="#search">Buscar</a>
<a href="#playlists">Playlists</a>
</nav>
</header>


<section id="home" class="hero">
<h1>Escute sem limites.</h1>
<p>Seu player moderno, bonito, rápido e inspirado no Spotify.</p>
<button class="btn">Começar a ouvir</button>
</section>


<section id="search" class="search-section">
<h2>Buscar músicas</h2>
<input type="text" id="searchInput" placeholder="Digite o nome da música..." />
<button onclick="searchMusic()" class="btn">Buscar</button>
<div id="results" class="results"></div>
</section>


<section id="playlists" class="playlist-section">
<h2>Playlists em destaque</h2>
<div class="playlist-grid">
<div class="playlist-card">
<img src="https://i.scdn.co/image/ab67706f000000029bb4d3c6c853fb29a8421931" />
<h3>Top Brasil</h3>
</div>
<div class="playlist-card">
<img src="https://i.scdn.co/image/ab67706f00000002ae6faba95ce53c6b66f0cc0d" />
<h3>Pop Hits</h3>
</div>
<div class="playlist-card">
<img src="https://i.scdn.co/image/ab67706f000000025c8e19fd166ed1a4d2b8a5fe" />
<h3>Treino</h3>
</div>
</div>
</section>


<footer class="footer">Criado com carinho para o trabalho final 💚</footer>


<script src="script.js"></script>
</body>
</html>
